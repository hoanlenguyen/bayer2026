# Frontend + backend on one server.  Run from deploy/vultr:  docker compose up -d --build
services:
  backend:
    build:
      context: ../..                 # repository root: the image also needs materials/
      dockerfile: backend/Dockerfile
    env_file: ${BACKEND_ENV_FILE:-../../backend/.env}   # OPENAI_API_KEY, MONGODB_URI, models ... (never committed)
    environment:
      OUTPUT_DIR: /app/backend/output
    volumes:
      - pbip-output:/app/backend/output   # generated PBIP projects survive restarts
    restart: unless-stopped
    expose:
      - "8000"                       # reachable only from the web container, not from the internet

  web:
    build:
      context: ../../frontend
      dockerfile: ../deploy/vultr/web.Dockerfile
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data              # HTTPS certificates
      - caddy-config:/config
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pbip-output:
  caddy-data:
  caddy-config:
