<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
</head>
<body>
<title>Curator Estate Explorer</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: app shell. Sticky top bar, entity header, two tabs: Details (main column + governance aside) and Graph (filters | canvas | inspector). */
:root {
  --bg: #f3f6f6; --surface: #ffffff; --surface-2: #edf2f2; --line: #d7e0e0; --line-strong: #aebcbd;
  --fg: #14202a; --muted: #54666f; --accent: #0b7566; --accent-fg: #ffffff; --accent-soft: #d8eeea;
  --ok: #1a7a3c; --ok-soft: #e0f2e6; --warn: #985600; --warn-soft: #fbeed6; --bad: #b42318; --bad-soft: #fbe4e1;
  --t-metric: #6a4cc0; --t-dashboard: #2360b2; --t-dataset: #0b7566; --t-source: #7a6950;
  --t-person: #bf5419; --t-glossary: #ad336b; --t-domain: #5b781b; --on-node: #ffffff;
  --font-sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --radius: 8px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1417; --surface: #141c20; --surface-2: #1a2429; --line: #283439; --line-strong: #4a5a61;
    --fg: #e3eaec; --muted: #94a5ac; --accent: #43c2a9; --accent-fg: #062520; --accent-soft: #15362f;
    --ok: #5ccb8a; --ok-soft: #173325; --warn: #e6a640; --warn-soft: #382a12; --bad: #f2776b; --bad-soft: #3d1c19;
    --t-metric: #a88ff2; --t-dashboard: #6fa8f2; --t-dataset: #43c2a9; --t-source: #bba98d;
    --t-person: #f29b60; --t-glossary: #ee82b3; --t-domain: #a8c65c; --on-node: #0e1417;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1417; --surface: #141c20; --surface-2: #1a2429; --line: #283439; --line-strong: #4a5a61;
  --fg: #e3eaec; --muted: #94a5ac; --accent: #43c2a9; --accent-fg: #062520; --accent-soft: #15362f;
  --ok: #5ccb8a; --ok-soft: #173325; --warn: #e6a640; --warn-soft: #382a12; --bad: #f2776b; --bad-soft: #3d1c19;
  --t-metric: #a88ff2; --t-dashboard: #6fa8f2; --t-dataset: #43c2a9; --t-source: #bba98d;
  --t-person: #f29b60; --t-glossary: #ee82b3; --t-domain: #a8c65c; --on-node: #0e1417;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--fg); }
body { margin: 0; font: 400 14px/1.5 var(--font-sans); -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; }
code, .mono { font-family: var(--font-mono); font-size: 0.92em; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* Top bar */
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); }
.topbar-inner { max-width: 1440px; margin: 0 auto; display: flex; align-items: center; gap: 12px; padding-block: 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); flex-wrap: wrap; }
.brand { color: var(--fg); text-decoration: none; display: flex; align-items: center; gap: 8px; font-weight: 700; letter-spacing: -0.01em; font-size: 15px; }
.brand-mark { width: 22px; height: 22px; border-radius: 6px; background: var(--accent); position: relative; flex: none; }
.brand-mark::after { content: ""; position: absolute; inset: 6px; border: 2px solid var(--accent-fg); border-radius: 50%; border-right-color: transparent; }
.topbar-sub { color: var(--muted); }
.crumb-sep { color: var(--line-strong); }
.search { position: relative; margin-left: auto; flex: 1 1 260px; max-width: 420px; min-width: 0; }
.search input { width: 100%; padding: 8px 12px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface-2); color: var(--fg); font: inherit; }
.search input::placeholder { color: var(--muted); }
.search-results { position: absolute; top: calc(100% + 6px); left: 0; right: 0; margin: 0; padding: 4px; list-style: none; background: var(--surface);
  border: 1px solid var(--line); border-radius: var(--radius); box-shadow: 0 10px 30px rgb(0 0 0 / 0.14); z-index: 20; max-height: 320px; overflow: auto; }
.search-results button { width: 100%; display: flex; align-items: center; gap: 8px; padding: 8px; border: 0; background: none; text-align: left; border-radius: 6px; cursor: pointer; }
.search-results button:hover, .search-results button.active { background: var(--surface-2); }
.search-results .ent-type { margin-left: auto; }
.sample-tag { font: 500 11px var(--font-mono); letter-spacing: 0.06em; text-transform: uppercase; color: var(--warn); background: var(--warn-soft); padding: 3px 8px; border-radius: 99px; }

/* Page */
.page { max-width: 1440px; margin: 0 auto; padding-block: 18px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 16px; }
.breadcrumb { display: flex; flex-wrap: wrap; gap: 6px; color: var(--muted); font-size: 13px; align-items: center; }
.breadcrumb button { border: 0; background: none; padding: 0; color: var(--accent); cursor: pointer; }
.breadcrumb [aria-current] { color: var(--fg); }

/* Entity header */
.entity-head { display: flex; gap: 20px; align-items: flex-end; justify-content: space-between; flex-wrap: wrap; }
.head-main { display: grid; gap: 8px; min-width: 0; }
.head-kicker { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.entity-head h1 { margin: 0; font-size: clamp(24px, 3.2vw, 32px); line-height: 1.15; font-weight: 600; letter-spacing: -0.02em; text-wrap: balance; }
.head-meta { display: flex; flex-wrap: wrap; gap: 6px 18px; color: var(--muted); font-size: 13px; align-items: center; }
.uid { display: inline-flex; gap: 6px; align-items: center; }
.uid code { color: var(--fg); background: var(--surface-2); padding: 2px 6px; border-radius: 4px; }
.copy { border: 1px solid var(--line); background: var(--surface); border-radius: 5px; padding: 1px 7px; font-size: 12px; cursor: pointer; color: var(--muted); }
.copy:hover { color: var(--fg); border-color: var(--line-strong); }
.inline-link { border: 0; background: none; padding: 0; color: var(--accent); cursor: pointer; font-weight: 500; }
.inline-link:hover { text-decoration: underline; }
.head-stats { display: flex; gap: 0; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }
.head-stat { padding: 8px 16px; display: grid; gap: 2px; min-width: 96px; }
.head-stat + .head-stat { border-left: 1px solid var(--line); }
.head-stat .k { font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
.head-stat .v { font: 600 18px var(--font-mono); font-variant-numeric: tabular-nums; }

.type-chip { display: inline-flex; align-items: center; gap: 6px; font: 500 12px var(--font-sans); padding: 2px 9px 2px 7px; border-radius: 99px; border: 1px solid var(--line); background: var(--surface); }
.tdot { width: 9px; height: 9px; border-radius: 50%; background: var(--tc, var(--muted)); flex: none; display: inline-block; }
.t-metric { --tc: var(--t-metric); } .t-dashboard { --tc: var(--t-dashboard); } .t-dataset { --tc: var(--t-dataset); }
.t-source { --tc: var(--t-source); } .t-person { --tc: var(--t-person); } .t-glossary { --tc: var(--t-glossary); } .t-domain { --tc: var(--t-domain); }

.pill { display: inline-flex; align-items: center; gap: 5px; font: 500 12px var(--font-sans); padding: 2px 9px; border-radius: 99px; white-space: nowrap; }
.pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.pill.sm { font-size: 11px; padding: 1px 7px; }
.tone-ok { color: var(--ok); background: var(--ok-soft); }
.tone-warn { color: var(--warn); background: var(--warn-soft); }
.tone-bad { color: var(--bad); background: var(--bad-soft); }
.tone-neutral { color: var(--muted); background: var(--surface-2); }

/* Tabs */
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); }
.tabs button { border: 0; background: none; padding: 10px 14px; cursor: pointer; color: var(--muted); font-weight: 500; border-bottom: 2px solid transparent; margin-bottom: -1px; }
.tabs button[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--accent); }
.tabs button:hover { color: var(--fg); }

/* Cards */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 18px; display: grid; gap: 12px; min-width: 0; }
.card-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.card-title { margin: 0; font-size: 12px; letter-spacing: 0.07em; text-transform: uppercase; color: var(--muted); font-weight: 600; display: flex; gap: 8px; align-items: center; }
.count { font: 500 11px var(--font-mono); color: var(--muted); background: var(--surface-2); border-radius: 99px; padding: 0 7px; letter-spacing: 0; }
.btn-ghost { border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 5px 10px; cursor: pointer; font-size: 13px; }
.btn-ghost:hover { border-color: var(--line-strong); }
.btn { border: 1px solid var(--accent); background: var(--accent); color: var(--accent-fg); border-radius: 6px; padding: 6px 12px; cursor: pointer; font-size: 13px; font-weight: 500; }
.btn:disabled { background: var(--surface-2); color: var(--muted); border-color: var(--line); cursor: default; }

/* Details tab */
.details-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 360px); gap: 16px; align-items: start; }
.details-main, .details-side { display: grid; gap: 16px; min-width: 0; }
.summary { margin: 0; max-width: 68ch; font-size: 15px; }
.props { margin: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.prop { box-shadow: 1px 1px 0 var(--line); padding: 10px 12px; display: grid; gap: 2px; min-width: 0; }
.prop dt { font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
.prop dd { margin: 0; overflow-wrap: anywhere; }
.prop.wide { grid-column: 1 / -1; }
.prop.wide dd { background: var(--surface-2); padding: 8px 10px; border-radius: 5px; }
.rel-group { display: grid; gap: 6px; }
.rel-group h3 { margin: 0; font-size: 13px; font-weight: 600; display: flex; gap: 8px; align-items: center; }
.rel-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.ent-link { width: 100%; display: flex; align-items: center; gap: 10px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); cursor: pointer; text-align: left; min-width: 0; }
.ent-link:hover { border-color: var(--line-strong); background: var(--surface-2); }
.ent-name { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.ent-type { color: var(--muted); font-size: 12px; white-space: nowrap; }
.ent-link .pill { margin-left: auto; }

.gov { margin: 0; display: grid; gap: 10px; }
.gov-row { display: grid; grid-template-columns: 120px minmax(0, 1fr); gap: 10px; align-items: center; }
.gov-row dt { color: var(--muted); font-size: 13px; }
.gov-row dd { margin: 0; min-width: 0; }
.meter { display: flex; align-items: center; gap: 8px; font: 500 13px var(--font-mono); font-variant-numeric: tabular-nums; }
.meter-track { flex: 1; height: 6px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
.meter-track span { display: block; height: 100%; border-radius: 99px; }
.action-box { border: 1px dashed var(--line-strong); border-radius: 6px; padding: 10px 12px; display: grid; gap: 8px; }
.action-box p { margin: 0; }
.action-box .k { font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
.action-box .done { color: var(--ok); font-size: 13px; }

.flags { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.flag { display: grid; gap: 4px; padding-bottom: 10px; border-bottom: 1px solid var(--line); }
.flag:last-child { border-bottom: 0; padding-bottom: 0; }
.flag-top { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.flag strong { font-weight: 600; }
.flag p { margin: 0; color: var(--muted); font-size: 13px; }
.empty { color: var(--muted); margin: 0; font-size: 13px; }
.prov { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; font-size: 13px; }
.prov li { display: grid; gap: 1px; }
.prov .src { font-weight: 500; }
.prov .meta { color: var(--muted); font-family: var(--font-mono); font-size: 12px; }

/* Graph tab */
.graph-layout { display: grid; grid-template-columns: 230px minmax(0, 1fr) 300px; gap: 12px; grid-template-areas: "filters stage inspector"; }
.graph-filters { grid-area: filters; } .graph-stage { grid-area: stage; } .graph-inspector { grid-area: inspector; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); min-width: 0; }
.graph-filters, .graph-inspector { padding: 14px; display: grid; gap: 16px; align-content: start; }
.fgroup { display: grid; gap: 8px; }
.fgroup h3 { margin: 0; font-size: 11px; letter-spacing: 0.07em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.seg button { border: 0; background: var(--surface); padding: 5px 12px; cursor: pointer; font-size: 13px; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); }
.type-toggle { display: flex; align-items: center; gap: 8px; font-size: 13px; cursor: pointer; }
.type-toggle input { margin: 0; accent-color: var(--accent); }
.type-toggle .n { margin-left: auto; font: 500 12px var(--font-mono); color: var(--muted); }
.type-toggle.zero { color: var(--muted); }
.edge-key { display: grid; gap: 6px; font-size: 13px; }
.edge-key div { display: flex; align-items: center; gap: 8px; }
.edge-key svg { flex: none; }
.stats { font: 500 12px var(--font-mono); color: var(--muted); }

.graph-stage { position: relative; overflow: hidden; }
.graph-canvas { height: 640px; background-color: var(--surface);
  background-image: radial-gradient(var(--line) 1px, transparent 1.2px); background-size: 22px 22px; touch-action: none; }
.graph-canvas svg { display: block; width: 100%; height: 100%; }
.graph-toolbar { position: absolute; top: 10px; right: 10px; display: flex; gap: 4px; }
.graph-toolbar button { width: 32px; height: 32px; border: 1px solid var(--line); background: var(--surface); border-radius: 6px; cursor: pointer; font: 500 15px var(--font-mono); color: var(--fg); display: grid; place-items: center; }
.graph-toolbar button:hover { border-color: var(--line-strong); }
.graph-hint { position: absolute; left: 10px; bottom: 10px; font-size: 12px; color: var(--muted); background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; }

.link { stroke: var(--line-strong); stroke-width: 1.4; fill: none; transition: opacity .15s; }
.link.k-bad { stroke: var(--bad); stroke-dasharray: 6 4; stroke-width: 1.8; }
.link.k-warn { stroke: var(--warn); stroke-dasharray: 6 4; stroke-width: 1.8; }
.link.k-accent { stroke: var(--accent); stroke-dasharray: 1 5; stroke-linecap: round; stroke-width: 2.2; }
.link.hot.k-base { stroke: var(--muted); stroke-width: 2; }
.arrow-base { fill: var(--line-strong); } .arrow-bad { fill: var(--bad); } .arrow-warn { fill: var(--warn); } .arrow-accent { fill: var(--accent); }
.link-label { font: 500 10px var(--font-mono); fill: var(--muted); text-anchor: middle; paint-order: stroke; stroke: var(--surface); stroke-width: 4px; stroke-linejoin: round; display: none; pointer-events: none; }
.link-label.always, .link-label.hot { display: inline; }
.link-label.k-bad { fill: var(--bad); } .link-label.k-warn { fill: var(--warn); } .link-label.k-accent { fill: var(--accent); }
.node { cursor: pointer; transition: opacity .15s; }
.node:focus { outline: none; }
.node .halo { fill: none; }
.node.is-focus .halo { fill: var(--accent-soft); }
.node .dot { fill: var(--tc); stroke: var(--surface); stroke-width: 2; }
.node .ring { fill: none; stroke: transparent; stroke-width: 2; }
.node.s-certified .ring { stroke: var(--ok); }
.node.s-conflict .ring { stroke: var(--bad); stroke-dasharray: 4 3; stroke-width: 2.4; }
.node.s-stale .ring, .node.s-orphaned .ring { stroke: var(--warn); stroke-dasharray: 4 3; stroke-width: 2.4; }
.node.s-draft .ring, .node.s-uncertified .ring { stroke: var(--line-strong); stroke-dasharray: 3 3; }
.node.selected .ring { stroke-width: 3.5; }
.node:focus-visible .ring { stroke: var(--accent); stroke-width: 3.5; stroke-dasharray: none; }
.node .glyph { font: 600 9.5px var(--font-mono); fill: var(--on-node); text-anchor: middle; dominant-baseline: central; pointer-events: none; }
.node.is-focus .glyph { font-size: 12px; }
.node .label { font: 500 11.5px var(--font-sans); fill: var(--fg); text-anchor: middle; paint-order: stroke; stroke: var(--surface); stroke-width: 4px; stroke-linejoin: round; pointer-events: none; }
.node.is-focus .label { font-size: 13px; font-weight: 600; }
.node.selected .label { font-weight: 600; }
.dim { opacity: 0.14; }

.insp-head { display: grid; gap: 6px; }
.insp-head h3 { margin: 0; font-size: 17px; font-weight: 600; line-height: 1.25; overflow-wrap: anywhere; }
.insp-props { margin: 0; display: grid; gap: 8px; font-size: 13px; }
.insp-props div { display: grid; gap: 1px; }
.insp-props dt { color: var(--muted); font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; }
.insp-props dd { margin: 0; overflow-wrap: anywhere; }
.insp-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.insp-flags { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; font-size: 13px; }
.insp-flags li { display: flex; gap: 8px; align-items: baseline; }

@media (max-width: 1180px) {
  .graph-layout { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); grid-template-areas: "stage stage" "filters inspector"; }
}
@media (max-width: 900px) {
  .details-grid { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 640px) {
  .graph-layout { grid-template-columns: minmax(0, 1fr); grid-template-areas: "stage" "inspector" "filters"; }
  .graph-canvas { height: 460px; }
  .head-stats { width: 100%; }
  .head-stat { flex: 1; min-width: 0; padding: 8px 12px; }
  .gov-row { grid-template-columns: minmax(0, 1fr); gap: 2px; }
  .graph-hint { display: none; }
  .topbar-sub, .crumb-sep { display: none; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="#details"><span class="brand-mark" aria-hidden="true"></span>Curator</a>
    <span class="crumb-sep" aria-hidden="true">/</span>
    <span class="topbar-sub">Estate Explorer</span>
    <div class="search">
      <label for="search" class="sr-only">Search entities</label>
      <input id="search" type="search" placeholder="Search metrics, dashboards, datasets, people" autocomplete="off" aria-controls="search-results" aria-expanded="false">
      <ul id="search-results" class="search-results" role="listbox" hidden></ul>
    </div>
    <span class="sample-tag" title="All entities on this page are fictional sample data">Sample data</span>
  </div>
</header>

<main class="page">
  <nav class="breadcrumb" id="breadcrumb" aria-label="Breadcrumb"></nav>
  <section class="entity-head" id="entity-head"></section>
  <div class="tabs" role="tablist" aria-label="Entity views">
    <button role="tab" id="tab-details" data-tab="details" aria-controls="panel-details">Details</button>
    <button role="tab" id="tab-graph" data-tab="graph" aria-controls="panel-graph">Graph</button>
  </div>
  <section id="panel-details" role="tabpanel" aria-labelledby="tab-details"></section>
  <section id="panel-graph" role="tabpanel" aria-labelledby="tab-graph" hidden>
    <div class="graph-layout">
      <aside class="graph-filters panel" id="graph-filters" aria-label="Graph filters"></aside>
      <div class="graph-stage panel">
        <div id="graph-canvas" class="graph-canvas">
          <svg id="graph-svg" role="img" aria-label="Relationship graph of the selected entity"></svg>
        </div>
        <div class="graph-toolbar">
          <button id="zoom-in" title="Zoom in" aria-label="Zoom in">+</button>
          <button id="zoom-out" title="Zoom out" aria-label="Zoom out">&minus;</button>
          <button id="zoom-fit" title="Fit to view" aria-label="Fit graph to view">&#x2922;</button>
        </div>
        <div class="graph-hint">Click to inspect · Double-click to refocus · Drag to rearrange</div>
      </div>
      <aside class="graph-inspector panel" id="graph-inspector" aria-label="Selected entity" aria-live="polite"></aside>
    </div>
  </section>
</main>

const pill = (status, sm) => { const st = STATUS[status]; return `<span class="pill tone-${st.tone}${sm ? " sm" : ""}">${st.label}</span>`; };

const ownerOf = id => { const l = EDGES.find(x => x.t === id && x.rel === "owns"); return l ? byId[l.s] : null; };

function relGroups(id) {
  const groups = new Map();
  EDGES.forEach(l => {
    let label, other;
    if (l.s === id) { label = REL[l.rel].out; other = l.t; }
    else if (l.t === id) { label = REL[l.rel].in; other = l.s; }
    else return;
    if (!groups.has(label)) groups.set(label, { label, kind: REL[l.rel].kind, items: [] });
    groups.get(label).items.push(byId[other]);
  });
  const order = g => g.kind === "bad" ? 0 : g.kind === "warn" ? 1 : g.kind === "accent" ? 2 : 3;
  return [...groups.values()].sort((a, b) => order(a) - order(b) || b.items.length - a.items.length);
}

function meter(v) {
  const pct = Math.round(v * 100);
  return `<span class="meter"><span class="meter-track"><span style="width:${pct}%;background:var(--${toneOf(v)})"></span></span>${v.toFixed(2)}</span>`;
}

    const btn = ev.currentTarget;
    const done = () => { btn.textContent = "Copied"; setTimeout(() => { btn.textContent = "Copy ID"; }, 1400); };
    const fallback = () => { const r = document.createRange(); r.selectNodeContents($("#uid-text")); const s = getSelection(); s.removeAllRanges(); s.addRange(r); btn.textContent = "Press Ctrl+C"; };
    try { navigator.clipboard.writeText(e.uid).then(done, fallback); } catch (_) { fallback(); }
  });
}

/* ---------- Details tab ---------- */
function entityRow(o) {
  return `<li><button type="button" class="ent-link t-${o.type}" data-focus="${o.id}">
    <span class="tdot"></span><span class="ent-name">${esc(o.name)}</span><span class="ent-type">${TYPES[o.type].label}</span>${pill(o.status, true)}</button></li>`;
}

function governanceRows(e) {
  const owner = ownerOf(e.id);
  const rows = [["Status", pill(e.status)]];
  if (owner) rows.push(["Owner", `<button type="button" class="inline-link" data-focus="${owner.id}">${esc(owner.name)}</button>${owner.status === "left" ? " " + pill("left", true) : ""}`]);
  if (e.type !== "person") rows.push(["Trust score", meter(e.trust)]);
  if (e.type === "metric") {
    const users = EDGES.filter(l => l.t === e.id && l.rel === "uses").map(l => byId[l.s]);
    rows.push(["Used by", `${users.length} dashboard${users.length === 1 ? "" : "s"}`]);
    rows.push(["Views via those", `${users.reduce((a, d) => a + (d.views || 0), 0).toLocaleString("en-US")} in 90 days`]);
  }
  if (e.type === "dashboard") rows.push(["Audience", `${e.views.toLocaleString("en-US")} views in 90 days`]);
  if (e.type === "person") {
    const owned = EDGES.filter(l => l.s === e.id && l.rel === "owns").length;
    rows.push(["Assets owned", String(owned)]);
  }
  if (e.props["Next review"]) rows.push(["Next review", e.props["Next review"]]);
  return rows.map(([k, v]) => `<div class="gov-row"><dt>${k}</dt><dd>${v}</dd></div>`).join("");
}

function renderDetails() {
  const e = byId[state.focus];
  const groups = relGroups(e.id);
  const total = groups.reduce((a, g) => a + g.items.length, 0);
  const wideKeys = new Set(["Formula", "Defined in", "Location"]);
  const codeKeys = new Set(["Formula", "Metric code", "Table"]);
  const props = Object.entries(e.props).map(([k, v]) =>
    `<div class="prop${wideKeys.has(k) ? " wide" : ""}"><dt>${esc(k)}</dt><dd${codeKeys.has(k) ? ' class="mono"' : ""}>${esc(v)}</dd></div>`).join("");
  const action = e.action ? `
    <div class="action-box">
      <span class="k">Recommended action</span>
      <p>${esc(e.action)}</p>
      ${state.sent.has(e.id)
        ? `<span class="done">Sent to ${esc((ownerOf(e.id) || { name: "the owner" }).name)} for approval. Nothing changes until they approve.</span>`
        : `<div><button type="button" class="btn" data-send="${e.id}">Send to owner for approval</button></div>`}
    </div>` : "";
  $("#panel-details").innerHTML = `
    <div class="details-grid">
      <div class="details-main">
        <article class="card"><h2 class="card-title">Summary</h2><p class="summary">${esc(e.summary)}</p></article>
        <article class="card"><h2 class="card-title">Properties</h2><dl class="props">${props}</dl></article>
        <article class="card">
          <div class="card-head"><h2 class="card-title">Relationships <span class="count">${total}</span></h2>
            <button type="button" class="btn-ghost" data-go="graph">View in graph</button></div>
          ${groups.map(g => `<div class="rel-group"><h3>${g.label} <span class="count">${g.items.length}</span></h3><ul class="rel-list">${g.items.map(entityRow).join("")}</ul></div>`).join("")}
        </article>
      </div>
      <aside class="details-side">
        <article class="card"><h2 class="card-title">Governance</h2><dl class="gov">${governanceRows(e)}</dl>${action}</article>
        <article class="card"><h2 class="card-title">AI review flags <span class="count">${e.flags.length}</span></h2>
          ${e.flags.length ? `<ul class="flags">${e.flags.map(f => `<li class="flag"><div class="flag-top"><span class="pill sm tone-${f.sev === "info" ? "neutral" : f.sev}">${SEV[f.sev]}</span><strong>${esc(f.title)}</strong></div><p>${esc(f.text)}</p></li>`).join("")}</ul>`
            : `<p class="empty">No open issues. The last review found nothing to flag.</p>`}
        </article>
        <article class="card"><h2 class="card-title">Provenance</h2>
          <ul class="prov">${PROV[e.type](e).map(([s, d, t]) => `<li><span class="src">${esc(s)}</span><span class="meta">${esc(d)} · ${t}</span></li>`).join("")}</ul>
        </article>
      </aside>
    </div>`;
}

/* ---------- Graph tab ---------- */
function neighborhood(focus, depth) {
  const dist = new Map([[focus, 0]]);
  const q = [focus];
  while (q.length) {
    const id = q.shift(), d = dist.get(id);
    if (d >= depth) continue;
    adj.get(id).forEach(n => {
      if (dist.has(n) || state.hidden.has(byId[n].type)) return;
      dist.set(n, d + 1); q.push(n);
    });
  }
  return dist;
}

function renderFilters() {
  const all = neighborhood(state.focus, state.depth === 99 ? 99 : state.depth);
  // counts ignore type filters so toggling a type back on shows what returns
  const hiddenBackup = new Set(state.hidden); state.hidden.clear();
  const full = neighborhood(state.focus, state.depth);
  hiddenBackup.forEach(t => state.hidden.add(t));
  const counts = {}; full.forEach((_, id) => { const t = byId[id].type; counts[t] = (counts[t] || 0) + 1; });
  const shownEdges = EDGES.filter(l => all.has(l.s) && all.has(l.t)).length;
  const depthBtn = (v, label) => `<button type="button" data-depth="${v}" aria-pressed="${state.depth === v}">${label}</button>`;
  const edgeKey = (cls, label) => `<div><svg width="34" height="8" aria-hidden="true"><line x1="1" y1="4" x2="33" y2="4" class="link ${cls}"></line></svg>${label}</div>`;
  $("#graph-filters").innerHTML = `
    <div class="fgroup"><h3>Depth</h3><div class="seg" role="group" aria-label="Graph depth">${depthBtn(1, "1 hop")}${depthBtn(2, "2 hops")}${depthBtn(99, "All")}</div></div>
    <div class="fgroup"><h3>Entity types</h3>
      ${Object.entries(TYPES).map(([k, t]) => `<label class="type-toggle t-${k}${counts[k] ? "" : " zero"}"><input type="checkbox" id="type-${k}" data-type="${k}" ${state.hidden.has(k) ? "" : "checked"}><span class="tdot"></span>${t.plural}<span class="n">${counts[k] || 0}</span></label>`).join("")}
    </div>
    <div class="fgroup"><h3>Relationships</h3><div class="edge-key">
      ${edgeKey("k-bad", "Metric conflict")}${edgeKey("k-warn", "Duplicate or overlap")}${edgeKey("k-accent", "Equivalent logic")}${edgeKey("k-base", "Lineage, usage, ownership")}
    </div></div>
    <div class="fgroup"><h3>Node ring</h3><div class="edge-key">
      <div>${pill("certified", true)} solid ring</div><div>${pill("conflict", true)} dashed ring</div><div>${pill("stale", true)} ${pill("orphaned", true)}</div>
    </div></div>
    <p class="stats">${all.size} entities · ${shownEdges} relationships</p>`;
}

function renderInspector() {
  const id = state.selected || state.focus, e = byId[id];
  const inView = graph.links ? graph.links.filter(l => l.source.id === id || l.target.id === id).length : 0;
  const props = Object.entries(e.props).slice(0, 4);
  $("#graph-inspector").innerHTML = `
    <div class="insp-head">
      <div class="head-kicker"><span class="type-chip t-${e.type}"><span class="tdot"></span>${TYPES[e.type].label}</span>${pill(e.status, true)}</div>
      <h3>${esc(e.name)}</h3>
      ${e.type !== "person" ? meter(e.trust) : ""}
    </div>
    <p class="empty">${esc(e.summary)}</p>
    <dl class="insp-props">${props.map(([k, v]) => `<div><dt>${esc(k)}</dt><dd${k === "Formula" || k === "Metric code" || k === "Table" ? ' class="mono"' : ""}>${esc(v)}</dd></div>`).join("")}</dl>
    ${e.flags.length ? `<div class="fgroup"><h3>Flags</h3><ul class="insp-flags">${e.flags.map(f => `<li><span class="pill sm tone-${f.sev === "info" ? "neutral" : f.sev}">${SEV[f.sev]}</span>${esc(f.title)}</li>`).join("")}</ul></div>` : ""}
    <p class="stats">${inView} relationship${inView === 1 ? "" : "s"} in this view</p>
    <div class="insp-actions">
      ${id !== state.focus ? `<button type="button" class="btn" data-focus-graph="${id}">Focus graph here</button>` : ""}
      <button type="button" class="btn-ghost" data-open="${id}">Open details</button>
    </div>`;
}

const graph = { nodes: [], links: [], nodeSel: null, linkSel: null, labelSel: null, sim: null, ready: false, dirty: true };
const posCache = new Map();
let svgSel, gRoot, zoom;
let seed = 7;
const rand = () => (seed = (seed * 16807) % 2147483647) / 2147483647;

function initGraph() {
  svgSel = d3.select("#graph-svg");
  const defs = svgSel.append("defs");
  ["base", "bad", "warn", "accent"].forEach(k => {
    defs.append("marker").attr("id", "arrow-" + k).attr("viewBox", "0 -5 10 10").attr("refX", 9).attr("refY", 0)
      .attr("markerWidth", 6).attr("markerHeight", 6).attr("orient", "auto")
      .append("path").attr("d", "M0,-4L10,0L0,4Z").attr("class", "arrow-" + k);
  });
  gRoot = svgSel.append("g");
  gRoot.append("g").attr("class", "links");
  gRoot.append("g").attr("class", "link-labels");
  gRoot.append("g").attr("class", "nodes");
  zoom = d3.zoom().scaleExtent([0.25, 3]).on("zoom", ev => gRoot.attr("transform", ev.transform));
  svgSel.call(zoom).on("dblclick.zoom", null);
  svgSel.on("click", ev => { if (ev.target === svgSel.node()) select(null); });
  $("#zoom-in").addEventListener("click", () => svgSel.transition().duration(reduced ? 0 : 200).call(zoom.scaleBy, 1.3));
  $("#zoom-out").addEventListener("click", () => svgSel.transition().duration(reduced ? 0 : 200).call(zoom.scaleBy, 1 / 1.3));
  $("#zoom-fit").addEventListener("click", () => fit(true));
  window.addEventListener("resize", () => { if (state.tab === "graph") { const c = $("#graph-canvas"); graph.sim && graph.sim.force("center", d3.forceCenter(c.clientWidth / 2, c.clientHeight / 2)); fit(false); } });
  graph.ready = true;
}

function buildGraph() {
  if (!graph.ready) initGraph();
  const wrap = $("#graph-canvas"), W = wrap.clientWidth, H = wrap.clientHeight;
  const dist = neighborhood(state.focus, state.depth);
  const nodes = [...dist.keys()].map(id => {
    const e = byId[id], p = posCache.get(id);
    return { id, e, r: id === state.focus ? 22 : TYPES[e.type].r,
      x: p ? p.x : W / 2 + (rand() - 0.5) * 160, y: p ? p.y : H / 2 + (rand() - 0.5) * 160 };
  });
  const links = EDGES.filter(l => dist.has(l.s) && dist.has(l.t))
    .map(l => ({ source: l.s, target: l.t, rel: l.rel, kind: REL[l.rel].kind || "base" }));

  graph.linkSel = gRoot.select(".links").selectAll("line").data(links).join("line")
    .attr("class", d => "link k-" + d.kind).attr("marker-end", d => `url(#arrow-${d.kind})`);
  graph.labelSel = gRoot.select(".link-labels").selectAll("text").data(links).join("text")
    .attr("class", d => "link-label k-" + d.kind + (d.kind !== "base" ? " always" : "")).text(d => REL[d.rel].out.toLowerCase());
  graph.nodeSel = gRoot.select(".nodes").selectAll("g.node").data(nodes, d => d.id).join(enter => {
    const g = enter.append("g");
    g.append("circle").attr("class", "halo");
    g.append("circle").attr("class", "ring");
    g.append("circle").attr("class", "dot");
    g.append("text").attr("class", "glyph");
    g.append("text").attr("class", "label");
    return g;
  });
  graph.nodeSel
    .attr("class", d => `node t-${d.e.type} s-${d.e.status}${d.id === state.focus ? " is-focus" : ""}`)
    .attr("tabindex", 0).attr("role", "button")
    .attr("aria-label", d => `${TYPES[d.e.type].label}: ${d.e.name}, ${STATUS[d.e.status].label}`);
  graph.nodeSel.select(".halo").attr("r", d => d.r + 14);
  graph.nodeSel.select(".ring").attr("r", d => d.r + 4);
  graph.nodeSel.select(".dot").attr("r", d => d.r);
  graph.nodeSel.select(".glyph").text(d => glyphOf(d.e));
  graph.nodeSel.select(".label").attr("y", d => d.r + 17).text(d => trunc(d.e.name, 26));
  graph.nodeSel
    .on("click", (ev, d) => { ev.stopPropagation(); select(d.id); })
    .on("dblclick", (ev, d) => { ev.stopPropagation(); setFocus(d.id); })
    .on("keydown", (ev, d) => {
      if (ev.key === "Enter") { ev.preventDefault(); setFocus(d.id); }
      else if (ev.key === " ") { ev.preventDefault(); select(d.id); }
    })
    .call(d3.drag()
      .on("start", (ev, d) => { if (!ev.active && !reduced) graph.sim.alphaTarget(0.2).restart(); d.fx = d.x; d.fy = d.y; })
      .on("drag", (ev, d) => { d.fx = ev.x; d.fy = ev.y; if (reduced) { d.x = ev.x; d.y = ev.y; ticked(); } })
      .on("end", (ev, d) => { if (!ev.active) graph.sim.alphaTarget(0); d.fx = null; d.fy = null; }));

  graph.nodes = nodes; graph.links = links;
  if (graph.sim) graph.sim.stop();
  graph.sim = d3.forceSimulation(nodes)
    .force("link", d3.forceLink(links).id(d => d.id).distance(l => (l.source.id === state.focus || l.target.id === state.focus) ? 150 : 115).strength(0.4))
    .force("charge", d3.forceManyBody().strength(-760))
    .force("center", d3.forceCenter(W / 2, H / 2))
    .force("collide", d3.forceCollide(d => d.r + 42))
    .force("x", d3.forceX(W / 2).strength(0.04))
    .force("y", d3.forceY(H / 2).strength(0.06))
    .on("tick", ticked)
    .stop();
  for (let i = 0; i < 300; i++) graph.sim.tick();
  ticked();
  fit(false);
  if (!reduced) graph.sim.alpha(0.05).restart();
  graph.dirty = false;
  select(state.selected && state.selected !== state.focus && graph.nodes.some(n => n.id === state.selected) ? state.selected : null);
}

function ticked() {
  graph.linkSel.each(function (d) {
    const dx = d.target.x - d.source.x, dy = d.target.y - d.source.y, len = Math.hypot(dx, dy) || 1;
    const ux = dx / len, uy = dy / len, sr = d.source.r + 5, tr = d.target.r + 7;
    this.setAttribute("x1", d.source.x + ux * sr); this.setAttribute("y1", d.source.y + uy * sr);
    this.setAttribute("x2", d.target.x - ux * tr); this.setAttribute("y2", d.target.y - uy * tr);
  });
  graph.labelSel.attr("x", d => (d.source.x + d.target.x) / 2).attr("y", d => (d.source.y + d.target.y) / 2 - 5);
  graph.nodeSel.attr("transform", d => `translate(${d.x},${d.y})`);
  graph.nodes.forEach(n => posCache.set(n.id, { x: n.x, y: n.y }));
}

function fit(animate) {
  if (!graph.nodes.length) return;
  const wrap = $("#graph-canvas"), W = wrap.clientWidth, H = wrap.clientHeight;
  if (!W || !H) return;
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  graph.nodes.forEach(n => { x0 = Math.min(x0, n.x - n.r - 70); x1 = Math.max(x1, n.x + n.r + 70); y0 = Math.min(y0, n.y - n.r - 20); y1 = Math.max(y1, n.y + n.r + 34); });
  const k = Math.min(1.6, 0.92 * Math.min(W / (x1 - x0), H / (y1 - y0)));
  const t = d3.zoomIdentity.translate(W / 2 - k * (x0 + x1) / 2, H / 2 - k * (y0 + y1) / 2).scale(k);
  (animate && !reduced ? svgSel.transition().duration(350) : svgSel).call(zoom.transform, t);
}

function select(id) {
  state.selected = id;
  if (graph.nodeSel) {
    const nb = new Set(id ? [id] : []);
    if (id) graph.links.forEach(l => { if (l.source.id === id) nb.add(l.target.id); if (l.target.id === id) nb.add(l.source.id); });
    const touches = l => l.source.id === id || l.target.id === id;
    graph.nodeSel.classed("dim", d => !!id && !nb.has(d.id)).classed("selected", d => d.id === id);
    graph.linkSel.classed("dim", l => !!id && !touches(l)).classed("hot", l => !!id && touches(l));
    graph.labelSel.classed("dim", l => !!id && !touches(l)).classed("hot", l => !!id && touches(l));
  }
  renderInspector();
}

/* ---------- Navigation ---------- */
function setFocus(id, opts = {}) {
  state.focus = id;
  state.selected = id;
  renderHead();
  renderDetails();
  renderFilters();
  graph.dirty = true;
  if (state.tab === "graph") buildGraph(); else renderInspector();
  if (opts.tab && opts.tab !== state.tab) showTab(opts.tab, true);
  if (opts.scroll !== false) window.scrollTo({ top: 0, behavior: reduced ? "auto" : "smooth" });
}

function showTab(tab, push) {
  state.tab = tab === "graph" ? "graph" : "details";
  document.querySelectorAll(".tabs [role=tab]").forEach(b => {
    const on = b.dataset.tab === state.tab;
    b.setAttribute("aria-selected", on); b.tabIndex = on ? 0 : -1;
  });
  $("#panel-details").hidden = state.tab !== "details";
  $("#panel-graph").hidden = state.tab !== "graph";
  if (state.tab === "graph" && graph.dirty) buildGraph();
  if (push && location.hash !== "#" + state.tab) history.replaceState(null, "", "#" + state.tab);
}

/* ---------- Events ---------- */
document.addEventListener("click", ev => {
  const t = ev.target.closest("[data-focus],[data-go],[data-send],[data-focus-graph],[data-open],[data-depth]");
  if (!t) return;
  if (t.dataset.focus) setFocus(t.dataset.focus);
  else if (t.dataset.go) showTab(t.dataset.go, true);
  else if (t.dataset.send) { state.sent.add(t.dataset.send); renderDetails(); }
  else if (t.dataset.focusGraph) setFocus(t.dataset.focusGraph, { scroll: false });
  else if (t.dataset.open) setFocus(t.dataset.open, { tab: "details" });
  else if (t.dataset.depth) { state.depth = Number(t.dataset.depth); renderFilters(); graph.dirty = true; buildGraph(); }
});
document.addEventListener("change", ev => {
  const t = ev.target;
  if (t.dataset && t.dataset.type) {
    if (t.checked) state.hidden.delete(t.dataset.type); else state.hidden.add(t.dataset.type);
    renderFilters(); graph.dirty = true; buildGraph();
  }
});
document.querySelectorAll(".tabs [role=tab]").forEach(b => {
  b.addEventListener("click", () => showTab(b.dataset.tab, true));
  b.addEventListener("keydown", ev => {
    if (ev.key === "ArrowRight" || ev.key === "ArrowLeft") {
      const next = b.dataset.tab === "details" ? "graph" : "details";
      showTab(next, true); $("#tab-" + next).focus();
    }
  });
});
window.addEventListener("hashchange", () => showTab(location.hash.slice(1), false));

/* Search */
const input = $("#search"), results = $("#search-results");
let active = -1, matches = [];
function closeSearch() { results.hidden = true; input.setAttribute("aria-expanded", "false"); active = -1; }
function drawResults() {
  results.innerHTML = matches.length
    ? matches.map((e, i) => `<li role="option" aria-selected="${i === active}"><button type="button" tabindex="-1" class="t-${e.type}${i === active ? " active" : ""}" data-pick="${e.id}"><span class="tdot"></span><span class="ent-name">${esc(e.name)}</span><span class="ent-type">${TYPES[e.type].label}</span></button></li>`).join("")
    : `<li class="empty" style="padding:8px">No entity matches “${esc(input.value)}”.</li>`;
}
input.addEventListener("input", () => {
  const q = input.value.trim().toLowerCase();
  if (!q) { closeSearch(); return; }
  matches = ENTITIES.filter(e => (e.name + " " + e.uid + " " + TYPES[e.type].label).toLowerCase().includes(q)).slice(0, 8);
  active = matches.length ? 0 : -1;
  drawResults(); results.hidden = false; input.setAttribute("aria-expanded", "true");
});
input.addEventListener("keydown", ev => {
  if (results.hidden) return;
  if (ev.key === "ArrowDown") { ev.preventDefault(); active = Math.min(matches.length - 1, active + 1); drawResults(); }
  else if (ev.key === "ArrowUp") { ev.preventDefault(); active = Math.max(0, active - 1); drawResults(); }
  else if (ev.key === "Enter" && matches[active]) { ev.preventDefault(); pick(matches[active].id); }
  else if (ev.key === "Escape") closeSearch();
});
results.addEventListener("mousedown", ev => ev.preventDefault());
results.addEventListener("click", ev => { const b = ev.target.closest("[data-pick]"); if (b) pick(b.dataset.pick); });
input.addEventListener("blur", closeSearch);
function pick(id) { input.value = ""; closeSearch(); setFocus(id); }

/* ---------- Boot ---------- */
renderHead();
renderDetails();
renderFilters();
renderInspector();
showTab(location.hash === "#graph" ? "graph" : "details", false);
})();
</script>

</body>
</html>
