server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # API calls go to the backend container. Buffering is off so the
    # Server-Sent Events of /api/chat and /api/simulator/turn arrive live.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    # Client-side routes such as /simulator and /cala-graph load the app.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
