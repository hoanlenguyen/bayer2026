server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # API calls go to the backend container. Buffering is off so the
    # Server-Sent Events of /api/chat and /api/simulator/turn arrive live.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    # Built files have a hash in their name, so they can be cached for good.
    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # A missing file (such as /src/main.tsx from a page the Vite dev server
    # left in the browser cache) gets a 404, not the app, so it fails clearly.
    location ~ \.[a-zA-Z0-9]+$ {
        try_files $uri =404;
    }

    # Client-side routes such as /simulator and /cala-graph load the app.
    # The page itself is never cached, so a new build shows up on reload.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
