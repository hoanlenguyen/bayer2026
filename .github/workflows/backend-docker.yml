# Test the backend, then build and push its Docker image to Docker Hub.
#
# Runs on every push to main that touches the backend, the data pack or this file,
# and can be started by hand from the Actions tab.
#
# Repository settings needed (Settings → Secrets and variables → Actions):
#   secrets.DOCKERHUB_USERNAME   Docker Hub user or organization
#   secrets.DOCKERHUB_TOKEN      Docker Hub access token (Account settings → Personal access tokens, Read & Write)
# Optional:
#   vars.DOCKERHUB_REPOSITORY    image name, default "analytics-manager-backend"
#
# Published tags: latest (main only), sha-<short sha>.
name: Backend image

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "materials/**"
      - ".dockerignore"
      - ".github/workflows/backend-docker.yml"
  pull_request:
    paths:
      - "backend/**"
      - "materials/**"
      - ".github/workflows/backend-docker.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
        env:
          LLM_PROVIDER: mock
          STAGE_DELAY: "0"

  image:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Image name
        id: name
        run: echo "image=${{ secrets.DOCKERHUB_USERNAME }}/${{ vars.DOCKERHUB_REPOSITORY || 'analytics-manager-backend' }}" >> "$GITHUB_OUTPUT"

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ steps.name.outputs.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-

      # Pull requests build the image to catch errors but never push.
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        if: github.event_name != 'pull_request'
        run: |
          {
            echo "### Backend image pushed"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo "Run: \`docker run -p 8000:8000 -e OPENAI_API_KEY=... -e MONGODB_URI=... ${{ steps.name.outputs.image }}:latest\`"
          } >> "$GITHUB_STEP_SUMMARY"
