# Called by Deploy live after Azure and /api/briefings/commercial are verified.
name: Frontend deploy

on:
  workflow_call:
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: false
      CLOUDFLARE_ACCOUNT_ID:
        required: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: frontend-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HAS_CLOUDFLARE: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
    steps:
      - name: Require Cloudflare deployment credentials
        if: env.HAS_CLOUDFLARE != 'true'
        run: |
          echo "::error::Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID in repository Settings > Secrets and variables > Actions. See docs/DEPLOY_FREE.md."
          echo "### Deployment blocked: Cloudflare credentials are missing" >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            deploy/cloudflare/package-lock.json

      - name: Install Wrangler
        working-directory: deploy/cloudflare
        run: npm ci

      - name: Build and deploy the free Worker
        working-directory: deploy/cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run deploy:free | tee deploy.log

      - name: Verify the live briefings page and API
        working-directory: deploy/cloudflare
        run: |
          url=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | head -1 || true)
          [ -n "$url" ] || { echo "::error::Could not read the live workers.dev address"; exit 1; }
          for _ in $(seq 1 12); do
            if [ "$(curl -sS -m 20 -o /dev/null -w '%{http_code}' "$url/briefings")" = 200 ] && \
              [ "$(curl -sS -m 20 -o /dev/null -w '%{http_code}' "$url/api/briefings/commercial")" = 200 ]; then
              echo "### Live briefings: $url/briefings" >> "$GITHUB_STEP_SUMMARY"
              echo "Both /briefings and /api/briefings/commercial returned 200." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 10
          done
          echo "::error::The live briefings page or API did not return 200"; exit 1
