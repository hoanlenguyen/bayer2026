# Frontend: on every push to main that changes the frontend or the Worker, build it and deploy the
# free Cloudflare Worker (deploy/cloudflare/wrangler.free.jsonc), which serves the app and forwards
# /api/* to the Azure backend.
#
# Needs repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID (docs/DEPLOY_FREE.md,
# "Automatic deploys"). Without them the build still runs as a check, and the deploy step is skipped.
name: Frontend deploy

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - frontend/**
      - deploy/cloudflare/**
      - .github/workflows/frontend-deploy.yml

permissions:
  contents: read

concurrency:
  group: frontend-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HAS_CLOUDFLARE: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            deploy/cloudflare/package-lock.json

      - name: Build frontend (type check included)
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Install Wrangler
        working-directory: deploy/cloudflare
        run: npm ci

      - name: Skip when Cloudflare is not connected yet
        if: env.HAS_CLOUDFLARE != 'true'
        run: echo "::notice::CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID is not set, so the frontend was built but not deployed."

      - name: Deploy the free Worker
        if: env.HAS_CLOUDFLARE == 'true'
        working-directory: deploy/cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy -c wrangler.free.jsonc | tee deploy.log

      - name: Smoke test
        if: env.HAS_CLOUDFLARE == 'true'
        working-directory: deploy/cloudflare
        run: |
          url=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | head -1)
          [ -n "$url" ] || { echo "::warning::Could not read the workers.dev address from the deploy output"; exit 0; }
          curl -fsS -m 30 -o /dev/null "$url/" && echo "page OK"
          # The backend may be asleep (scales to zero); give it up to 2 minutes.
          for _ in $(seq 1 12); do curl -fsS -m 20 "$url/api/health" && break; sleep 10; done
          echo "### Frontend deployed: $url" >> "$GITHUB_STEP_SUMMARY"
