# Backend: test, build the image, and on main deploy it to Azure Container Apps.
#
#   push to main, version-2 or version-4 (backend/, materials/ ...)  → tests → image to ghcr.io
#   push to main only                                                → also deploy that image to the Container App
#
# Image: ghcr.io/<owner>/bayer2026-backend:latest and :<commit sha>
# Deploy needs the repository secrets AZURE_CLIENT_ID, AZURE_TENANT_ID and AZURE_SUBSCRIPTION_ID from
# `bash deploy/azure/containerapp.sh github` (a managed identity GitHub signs in as with OIDC, no password).
# Without it the deploy job is skipped and says so; nothing fails.
name: Backend image

on:
  workflow_dispatch:
  push:
    branches: [main, version-2, version-4]
    paths:
      - backend/**
      - materials/**
      - .dockerignore
      - .github/workflows/backend-image.yml

permissions:
  contents: read
  packages: write

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: false

env:
  AZURE_RG: analytics-manager-rg
  AZURE_APP: analytics-manager-api

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - name: Tests (offline, mock model, in-memory store)
        working-directory: backend
        run: python -m pytest -q

  build:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      image: ${{ steps.name.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Image name (registry names must be lowercase)
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/bayer2026-backend" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: |
            ${{ steps.name.outputs.image }}:latest
            ${{ steps.name.outputs.image }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      id-token: write   # OIDC sign-in to Azure
      contents: read
    env:
      HAS_AZURE: ${{ secrets.AZURE_CLIENT_ID != '' && secrets.AZURE_TENANT_ID != '' && secrets.AZURE_SUBSCRIPTION_ID != '' }}
    steps:
      - name: Skip when Azure is not connected yet
        if: env.HAS_AZURE != 'true'
        run: echo "::notice::AZURE_CLIENT_ID, AZURE_TENANT_ID or AZURE_SUBSCRIPTION_ID is not set, so the backend was built but not deployed. See docs/DEPLOY_FREE.md, Automatic deploys."

      - uses: azure/login@v2
        if: env.HAS_AZURE == 'true'
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy this commit's image to the Container App
        if: env.HAS_AZURE == 'true'
        run: |
          az extension add --name containerapp --upgrade --only-show-errors
          # A unique tag per commit starts a new revision, which pulls the new image.
          az containerapp update -n "$AZURE_APP" -g "$AZURE_RG" \
            --image "${{ needs.build.outputs.image }}:${{ github.sha }}" -o none
          fqdn=$(az containerapp show -n "$AZURE_APP" -g "$AZURE_RG" --query properties.configuration.ingress.fqdn -o tsv)
          echo "BACKEND=https://$fqdn" >> "$GITHUB_ENV"

      - name: Health check
        if: env.HAS_AZURE == 'true'
        run: |
          # The new revision can take a minute to start; retry for up to 3 minutes.
          for _ in $(seq 1 18); do
            if body=$(curl -fsS -m 20 "$BACKEND/api/health"); then
              echo "$body"; echo "### Backend deployed: $BACKEND" >> "$GITHUB_STEP_SUMMARY"; exit 0
            fi
            sleep 10
          done
          echo "::error::$BACKEND/api/health did not answer after deploy"; exit 1
