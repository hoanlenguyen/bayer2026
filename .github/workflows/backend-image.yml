# Builds the backend image and pushes it to GitHub Container Registry (free):
#   ghcr.io/<owner>/bayer2026-backend:latest  and  :<commit sha>
# Azure Container Apps pulls it from there (docs/DEPLOY_FREE.md).
name: Backend image

on:
  workflow_dispatch:
  push:
    branches: [main, version-2]
    paths:
      - backend/**
      - materials/**
      - .dockerignore
      - .github/workflows/backend-image.yml

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Image name (registry names must be lowercase)
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/bayer2026-backend" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: |
            ${{ steps.name.outputs.image }}:latest
            ${{ steps.name.outputs.image }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
